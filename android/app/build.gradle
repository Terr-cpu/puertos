plugins {
    id 'com.android.application'
}

android {
    namespace 'org.asispuerto.admin'
    compileSdk 34
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'org.asispuerto.admin'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '1.2.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Solo para las pruebas en el ordenador (el org.json de Android no funciona fuera del mÃ³vil)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
